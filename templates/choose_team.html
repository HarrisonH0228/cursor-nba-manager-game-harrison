{% extends "base.html" %}

{% block content %}
<div class="choose-team-header mb-4">
  <h1 class="display-hero mb-2" style="font-size:2rem;">Choose Your Team</h1>
  <p class="text-muted-nba mb-3" style="max-width:520px;line-height:1.6;">
    Pick any of the 30 NBA franchises and take over as General Manager.
  </p>
  <div style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;">
    <a href="{{ url_for('index') }}" class="btn-nba-secondary btn-nba-sm">Back</a>
    <form method="post" action="{{ url_for('start') }}" id="roll-team-form">
      <input type="hidden" name="difficulty" id="roll-difficulty" value="normal">
      <button type="submit" class="btn-nba-secondary btn-nba-sm">Roll instead</button>
    </form>
  </div>
</div>

<div class="difficulty-picker glass-liquid mb-4">
  <p class="section-title mb-2">Difficulty</p>
  <div class="difficulty-options" role="radiogroup" aria-label="Game difficulty">
    {% for level in difficulty_levels %}
    <label class="difficulty-option{% if level == 'normal' %} difficulty-option-active{% endif %}">
      <input type="radio" name="difficulty_choice" value="{{ level }}"{% if level == 'normal' %} checked{% endif %}>
      <span class="difficulty-option-label">{{ difficulty_labels[level] }}</span>
      <span class="difficulty-option-desc">{{ difficulty_descriptions[level] }}</span>
    </label>
    {% endfor %}
  </div>
</div>

<div class="team-picker-grid">
  {% for team in teams %}
  <form method="post" action="{{ url_for('start_pick') }}" class="team-picker-form">
    <input type="hidden" name="team_id" value="{{ team.id }}">
    <input type="hidden" name="difficulty" class="team-difficulty-input" value="normal">
    <button type="submit" class="team-picker-card" aria-label="Select {{ team.full_name }}">
      <img
        class="team-logo-lg"
        data-team-logo="{{ team.full_name }}"
        alt="{{ team.full_name }}"
        onerror="this.style.display='none'"
      >
      <span class="team-picker-name">{{ team.full_name }}</span>
      <span class="team-picker-abbr">{{ team.abbreviation }}</span>
    </button>
  </form>
  {% endfor %}
</div>

<script>
(function () {
  var radios = document.querySelectorAll('input[name="difficulty_choice"]');
  var rollInput = document.getElementById('roll-difficulty');
  var teamInputs = document.querySelectorAll('.team-difficulty-input');
  var options = document.querySelectorAll('.difficulty-option');

  function syncDifficulty(value) {
    if (rollInput) rollInput.value = value;
    teamInputs.forEach(function (input) { input.value = value; });
    options.forEach(function (option) {
      var radio = option.querySelector('input[type="radio"]');
      option.classList.toggle('difficulty-option-active', radio && radio.value === value);
    });
  }

  radios.forEach(function (radio) {
    radio.addEventListener('change', function () {
      if (radio.checked) syncDifficulty(radio.value);
    });
  });
})();
</script>
{% endblock %}
