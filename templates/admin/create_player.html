{% extends "base.html" %}
{% block content %}
<h1>Create Player</h1>
<form method="post" class="card-nba p-4">
  <div class="mb-3"><label>Name</label><input class="form-control" name="name" value="{{ form_data.get('name', '') if form_data else '' }}" required></div>
  <div class="mb-3"><label>Overall</label><input class="form-control" name="overall" value="{{ form_data.get('overall', '60') if form_data else '60' }}"></div>
  <div class="mb-3"><label>Age</label><input class="form-control" name="age" value="{{ form_data.get('age', '20') if form_data else '20' }}"></div>
  <h3 style="font-size:1rem;margin:1rem 0;">Career (optional)</h3>
  <div class="mb-3"><label>Potential</label><input class="form-control" name="potential" placeholder="auto" value="{{ form_data.get('potential', '') if form_data else '' }}"></div>
  <div class="mb-3"><label>PPG</label><input class="form-control" name="ppg" step="0.1" placeholder="auto" value="{{ form_data.get('ppg', '') if form_data else '' }}"></div>
  <div class="mb-3"><label>Peak age</label><input class="form-control" name="peak_age" placeholder="auto" value="{{ form_data.get('peak_age', '') if form_data else '' }}"></div>
  <div class="mb-3"><label>Retirement age</label><input class="form-control" name="retirement_age" placeholder="auto" value="{{ form_data.get('retirement_age', '') if form_data else '' }}"></div>
  <div class="mb-3"><label>Development rate</label><input class="form-control" name="development_rate" step="0.01" placeholder="auto" value="{{ form_data.get('development_rate', '') if form_data else '' }}"></div>
  <div class="mb-3">
    <label>Destination</label>
    <select class="form-control" name="destination">
      <option value="draft" {% if not form_data or form_data.get('destination', 'draft') == 'draft' %}selected{% endif %}>Draft Pool</option>
      <option value="team" {% if form_data and form_data.get('destination') == 'team' %}selected{% endif %}>Team Roster</option>
    </select>
  </div>
  <div class="mb-3">
    <label>Team (if assigning to roster)</label>
    <select class="form-control" name="team_id">
      <option value="">—</option>
      {% for team in teams %}
      <option value="{{ team.team_id }}" {% if form_data and form_data.get('team_id') == team.team_id|string %}selected{% endif %}>{{ team.team_name }}</option>
      {% endfor %}
    </select>
  </div>
  {% for key in attribute_keys %}
  <div class="mb-2"><label>{{ key|title }}</label><input class="form-control" name="attr_{{ key }}" placeholder="auto" value="{{ form_data.get('attr_' ~ key, '') if form_data else '' }}"></div>
  {% endfor %}
  <button type="submit" class="btn-nba-primary mt-3">Create</button>
</form>
{% endblock %}
