{% extends "base.html" %}
{% block content %}
<h1>Create Player</h1>
<form method="post" class="card-nba p-4">
  <div class="mb-3"><label>Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label>Overall</label><input class="form-control" name="overall" value="60"></div>
  <div class="mb-3"><label>Age</label><input class="form-control" name="age" value="20"></div>
  <div class="mb-3">
    <label>Destination</label>
    <select class="form-control" name="destination">
      <option value="draft">Draft Pool</option>
      <option value="team">Team Roster</option>
    </select>
  </div>
  <div class="mb-3">
    <label>Team (if assigning to roster)</label>
    <select class="form-control" name="team_id">
      <option value="">—</option>
      {% for team in teams %}
      <option value="{{ team.team_id }}">{{ team.team_name }}</option>
      {% endfor %}
    </select>
  </div>
  {% for key in attribute_keys %}
  <div class="mb-2"><label>{{ key|title }}</label><input class="form-control" name="attr_{{ key }}" placeholder="auto"></div>
  {% endfor %}
  <button type="submit" class="btn-nba-primary mt-3">Create</button>
</form>
{% endblock %}
