{% extends "base.html" %}
{% block content %}
<h1>Create Player</h1>
<form method="post" class="card-nba p-4">
  <div class="mb-3"><label>Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label>Overall</label><input class="form-control" name="overall" value="60"></div>
  <div class="mb-3"><label>Age</label><input class="form-control" name="age" value="20"></div>
  <h3 style="font-size:1rem;margin:1rem 0;">Career (optional)</h3>
  <div class="mb-3"><label>Potential</label><input class="form-control" name="potential" placeholder="auto"></div>
  <div class="mb-3"><label>PPG</label><input class="form-control" name="ppg" step="0.1" placeholder="auto"></div>
  <div class="mb-3"><label>Peak age</label><input class="form-control" name="peak_age" placeholder="auto"></div>
  <div class="mb-3"><label>Retirement age</label><input class="form-control" name="retirement_age" placeholder="auto"></div>
  <div class="mb-3"><label>Development rate</label><input class="form-control" name="development_rate" step="0.01" placeholder="auto"></div>
  <div class="mb-3">
    <label>Destination</label>
    <select class="form-control" name="destination">
      <option value="draft">Draft Pool</option>
      <option value="team">Team Roster</option>
    </select>
  </div>
  <div class="mb-3">
    <label>Team (if assigning to roster)</label>
    <select class="form-control" name="team_id">
      <option value="">—</option>
      {% for team in teams %}
      <option value="{{ team.team_id }}">{{ team.team_name }}</option>
      {% endfor %}
    </select>
  </div>
  {% for key in attribute_keys %}
  <div class="mb-2"><label>{{ key|title }}</label><input class="form-control" name="attr_{{ key }}" placeholder="auto"></div>
  {% endfor %}
  <button type="submit" class="btn-nba-primary mt-3">Create</button>
</form>
{% endblock %}
